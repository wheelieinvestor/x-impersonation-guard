name: Feature request
description: Suggest a focused improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try or consider?
    validations:
      required: false
  - type: dropdown
    id: help-build
    attributes:
      label: Would you help build it?
      options:
        - "Yes"
        - "Maybe"
        - "No"
    validations:
      required: true
