protected_identities:
  - name: "Example Creator"
    handle: "examplecreator"
    display_name: "Example Creator"
    user_id: null
    type: "individual"
    report_as: "Me or someone I am authorized to represent"
    reporter_name: "Example Creator"
    reporter_email: "creator@example.com"
    extra_handle_variants:
      - "example_creator"
      - "examplecreator_*"
      - "*_examplecreator"
    extra_display_variants:
      - "Example Charts"
      - "Example Creator Official"
    auto_report_threshold: 95
x_api:
  mode: "auto"
  bearer_token_env: "X_API_BEARER_TOKEN"
  max_cost_per_scan_usd: 2.0
scoring:
  thresholds:
    review_queue_medium: 70
    review_queue_high: 90
  weights:
    handle_similarity: 20
    name_similarity: 15
    bio_similarity: 10
    image_similarity: 25
    account_age: 10
    follower_ratio: 5
    follow_back_pattern: 5
    posting_behavior: 5
    verified_status: 5
reporting:
  auto_submit: false
  max_reports_per_24h: 5
  delay_between_reports_seconds: [90, 300]
  headless: false
storage:
  db_path: "~/.x-impersonation-guard/db.sqlite"
  evidence_dir: "~/.x-impersonation-guard/evidence"
  reports_dir: "~/.x-impersonation-guard/reports"
logging:
  level: "INFO"
  format: "json"
