[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "x-impersonation-guard"
version = "0.2.0a0"
description = "Locally runnable X impersonation detection, review, and reporting automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Wheelhouse Capital LLC" }]
keywords = [
    "x",
    "twitter",
    "impersonation",
    "brand-protection",
    "security",
    "creator-tools",
    "playwright",
    "osint",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "httpx==0.28.1",
    "imagehash==4.3.2",
    "pillow==12.2.0",
    "playwright==1.60.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "email-validator==2.3.0",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.5",
    "sqlalchemy==2.0.51",
    "structlog==25.5.0",
    "textual==8.2.8",
    "tweepy==4.16.0",
    "typer==0.26.8",
]

[project.scripts]
xig = "x_impersonation_guard.cli:app"
x-impersonation-guard = "x_impersonation_guard.cli:app"

[project.urls]
Homepage = "https://github.com/wheelieinvestor/x-impersonation-guard"
Documentation = "https://wheelieinvestor.github.io/x-impersonation-guard/"
Issues = "https://github.com/wheelieinvestor/x-impersonation-guard/issues"
Source = "https://github.com/wheelieinvestor/x-impersonation-guard"
Changelog = "https://github.com/wheelieinvestor/x-impersonation-guard/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-playwright==0.8.0",
    "respx==0.23.1",
    "ruff==0.15.20",
    "types-pyyaml==6.0.12.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/x_impersonation_guard"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
plugins = []

[[tool.mypy.overrides]]
module = ["imagehash", "tweepy", "playwright.*", "textual.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: tests that require browser or network style setup",
    "e2e: end-to-end tests skipped by default",
]
addopts = "-m 'not e2e'"
